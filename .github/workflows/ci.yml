name: CI

on:
  pull_request:
  push:
    branches: [main]

# The default `run` shell is `bash -e` without pipefail, so `a | b` passes when `a` fails.
# Naming the shell switches GitHub to `bash -eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all JS
        run: for f in *.js; do node --check "$f"; done
      - name: Run unit tests
        # `npm test` stops at the first failing test (scripts/bail-reporter.mjs). `node --test`
        # exits 0 when it finds no test files, and skipped or todo tests don't fail it either, so
        # check the summary as well as the exit code.
        run: |
          npm test 2>&1 | tee test.log
          grep -qE '^ℹ tests [1-9]' test.log || { echo "::error::no tests ran"; exit 1; }
          grep -qx 'ℹ skipped 0' test.log && grep -qx 'ℹ todo 0' test.log \
            || { echo "::error::skipped or todo tests are not allowed"; exit 1; }
